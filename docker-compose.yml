version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gitpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitpulse_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gitpulse_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./gitpulse/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./gitpulse/migrations/002_bronze_storage_layer.sql:/docker-entrypoint-initdb.d/002_bronze_storage_layer.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitpulse} -d ${POSTGRES_DB:-gitpulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./gitpulse
      dockerfile: docker/Dockerfile.backend
    container_name: gitpulse_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-gitpulse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gitpulse_secret}
      - POSTGRES_DB=${POSTGRES_DB:-gitpulse_db}
      - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DBT_PROJECT_DIR=/app/dbt
      - DBT_PROFILES_DIR=/app/dbt
    volumes:
      - ./gitpulse/backend:/app/backend
      - ./gitpulse/dbt:/app/dbt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./gitpulse
      dockerfile: docker/Dockerfile.frontend
    container_name: gitpulse_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    volumes:
      - ./gitpulse/frontend:/app/frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

