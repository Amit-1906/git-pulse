[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0a0d14"
secondaryBackgroundColor = "#0f141e"
textColor = "#f1f5f9"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
