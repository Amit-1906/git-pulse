[theme]
base = "dark"
primaryColor = "#06b6d4"
backgroundColor = "#080c16"
secondaryBackgroundColor = "#0d1424"
textColor = "#f8fafc"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
showSidebarNavigation = false
