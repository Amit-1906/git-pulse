gitpulse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_SERVER', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'gitpulse') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'gitpulse_secret') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'gitpulse_db') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_SERVER', 'postgres') }}"
      user: "{{ env_var('POSTGRES_USER', 'gitpulse') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'gitpulse_secret') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'gitpulse_db') }}"
      schema: public
      threads: 8
      keepalives_idle: 0

